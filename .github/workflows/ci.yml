name: CI

# CI starts from a fresh clone, like a newcomer: the same `just` recipes, no
# project keys. Without the program keypair, `just build` makes a throwaway
# program id and points the source at it, in CI's checkout only.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  program:
    name: On-chain program (Rust / Anchor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - name: Build, lint and test (LiteSVM)
        run: |
          just build
          just lint-program
          just test-program

  app:
    name: App (Python / Django) against a local validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7
      - name: Lint
        run: just lint-app
      - name: Build the program
        run: just build
      - name: Start the environment (database, app, validator) and deploy
        run: |
          just bootstrap localnet
          just deploy localnet
      - name: Test
        run: just test-app -v
      - name: Logs on failure
        if: failure()
        run: just dc localnet logs
