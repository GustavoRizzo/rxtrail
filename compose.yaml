# One file, one environment per run. The justfile picks it:
#   docker compose -p rxtrail-<network> --env-file envs/<network>.env ...
# Each environment gets its own containers, volumes (database, chain) and
# keys, so localnet and devnet can run side by side without ever mixing.

x-app: &app
  build: app
  image: rxtrail-app
  env_file: envs/${RXTRAIL_NETWORK}.env
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ./app:/app
    - ./.keys/${RXTRAIL_NETWORK}:/keys
  depends_on:
    db:
      condition: service_healthy

x-chain: &chain
  build:
    context: program
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: rxtrail-chain
  # Agave and Anchor ship x86-64 Linux binaries; Apple Silicon runs them
  # emulated (Docker Desktop: enable Rosetta).
  platform: linux/amd64
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  # Off-chain store: personal data and prescription documents never go on-chain.
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRANSACTIONAL_DB_USER: ${TRANSACTIONAL_DB_USER}
      TRANSACTIONAL_DB_PASSWORD: ${TRANSACTIONAL_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Postgres 18 wants the volume at /var/lib/postgresql, not .../data.
      - pgdata:/var/lib/postgresql
      - ./app/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Python/Django app: domain, Solana client, web.
  web:
    <<: *app
    ports:
      - "${WEB_PORT}:8000"

  # Private single-node Solana cluster (localnet environment only).
  validator:
    <<: *chain
    entrypoint: ["localnet-entrypoint"]
    ports:
      - "${LOCALNET_RPC_PORT:-59899}:8899"
      - "${LOCALNET_WS_PORT:-59900}:8900"
    volumes:
      - ledger:/home/builder/ledger
    environment:
      LOCALNET_LEDGER_SHREDS: ${LOCALNET_LEDGER_SHREDS:-2000000}
    security_opt:
      # Agave 4.x requires io_uring, which Docker's default seccomp profile
      # blocks. Lifted for this local-only, non-root container.
      - seccomp=unconfined
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' \"http://$$(hostname -i | awk '{print $$1}'):8899\" | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 30
    profiles: ["validator"]

  # Rust/Anchor toolchain for one-off commands (build, test, deploy).
  chain:
    <<: *chain
    volumes:
      - ./program:/work
      - ./.keys/${RXTRAIL_NETWORK}:/keys
      # Caches survive between runs: crates, Rust toolchains, SBF platform tools.
      - cargo-registry:/home/builder/.cargo/registry
      - rustup:/home/builder/.rustup
      - solana-cache:/home/builder/.cache/solana
    profiles: ["tools"]

volumes:
  pgdata:
  ledger:
  cargo-registry:
  rustup:
  solana-cache:
