[package]
name = "rxtrail"
version = "0.1.0"
description = "RxTrail: tamper-proof dispensing limits for controlled prescriptions, on Solana."
authors = ["Gustavo Rizzo S. M. de Albuquerque"]
repository = "https://github.com/GustavoRizzo/rxtrail"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "rxtrail"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.1"

[dev-dependencies]
# LiteSVM runs the compiled program in-process. Versions must match the SBF
# binaries Agave 4.x produces (litesvm 0.10 from the template cannot load them).
litesvm = "0.17.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
proptest = "1.11.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
