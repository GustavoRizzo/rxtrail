<details class="rx-card rx-reveal mt-6 p-5 text-sm" style="--i:2">
  <summary class="flex cursor-pointer items-center gap-2 font-semibold text-slate-100"><i data-lucide="book-open" class="h-4 w-4 text-brand-secondary"></i> How to read this</summary>
  <dl class="mt-4 grid gap-4 sm:grid-cols-3">
    <div><dt class="text-xs uppercase tracking-wide text-slate-500">What it measures</dt><dd class="mt-1 text-slate-300">{{ measures }}</dd></div>
    <div><dt class="text-xs uppercase tracking-wide text-slate-500">What it does not</dt><dd class="mt-1 text-slate-300">{{ not_measures }}</dd></div>
    <div><dt class="text-xs uppercase tracking-wide text-slate-500">Legitimate explanations</dt><dd class="mt-1 text-slate-300">{{ explanations }}</dd></div>
  </dl>
</details>
