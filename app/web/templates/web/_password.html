{# Password field with a show/hide toggle. `model` binds it to an Alpine variable. #}
<label class="block text-xs font-medium uppercase tracking-wide text-slate-500">{{ label|default:"Password" }}
  <div class="relative mt-1.5" x-data="{ show: false }">
    <input :type="show ? 'text' : 'password'" type="password" name="{{ name|default:'password' }}"
           {% if model %}x-model="{{ model }}"{% endif %} autocomplete="{{ autocomplete|default:'current-password' }}"
           {% if required %}required{% endif %} class="rx-input pr-11 normal-case">
    <button type="button" @click="show = !show" :aria-label="show ? 'Hide password' : 'Show password'"
            :title="show ? 'Hide password' : 'Show password'"
            class="absolute inset-y-0 right-0 grid w-11 place-items-center text-slate-500 transition hover:text-slate-200">
      <span x-show="!show"><i data-lucide="eye" class="h-4 w-4"></i></span>
      <span x-show="show" x-cloak><i data-lucide="eye-off" class="h-4 w-4"></i></span>
    </button>
  </div>
</label>
